<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <div class="container">
        <header>
            <div class="header-text">
                <img 
                    src="images/odin-lined.png" 
                    alt="An Odin-sketch"
                    width="80">
                <h1>ODIN</h1>
            </div>
        </header>
        <main>
            <section class="main-top">
                <p>
                    This is not a real online service! You know you need
                    something like this in your life to help you realize
                    your deepest dreams. Sign up <em>now</em> to get started.
                </p>
                <p>
                    You <em>know</em> you want to.
                </p>
            </section>

            <section class="form-section">
            <p>Let's do this!</p>
            <form action="" method="get" id="form">
                <div class="form-row">
                    <label for="first-name">FIRST NAME</label>
                    <input type="text" id="first-name" name="first-name"/>
                </div>
                <div class="form-row">
                    <label for="last-name">LAST NAME</label>
                    <input type="text" id="last-name" name="last-name"/>
                </div>
                <div class="form-row">
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" name="email"/>
                </div>
                <div class="form-row">
                    <label for="phone">PHONE NUMBER</label>
                    <input type="tel" id="phone" name="phone"/>
                </div>
                <div class="form-row password">
                    <label for="password">PASSWORD</label>
                    <input  type="password" id="password" 
                            name="password" minlength="8"/>
                </div>
                <div class="form-row password">
                    <label for="password-confirm">CONFIRM PASSWORD</label>
                    <input  type="password" id="password-confirm" 
                            name="password-confirm" minlength="8"/>
                </div>    
            </form>
            </section>

            <section class="main-bottom">
                <button type="submit" form="form">
                    Create Account
                </button>
                <p class="small-text">
                    Already have an account? <a href="#">Log in</a>
                </p>
            </section>           
        </main>
    </div>

</body>
</html>
